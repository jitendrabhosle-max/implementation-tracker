  :root{
    --bg:#12141a;
    --surface:#1a1d24;
    --surface-2:#20242c;
    --border:#2b2f38;
    --text:#e7e9ee;
    --text-dim:#8b9099;
    --poc:#5eead4;
    --poc-dim:#1b3a37;
    --live:#fb923c;
    --live-dim:#3a2818;
    --danger:#f16a6a;
    --rag-green:#4ade80;
    --rag-amber:#fbbf24;
    --rag-red:#f16a6a;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:var(--sans);overflow:hidden;max-width:100%;height:100%;}
  #app{
    background:var(--bg); height:100vh; height:100dvh; padding:24px 24px 12px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .header{ display:grid; grid-template-columns:1fr auto 1fr; align-items:flex-start; margin-bottom:8px; gap:16px; flex:0 0 auto; }
  .header-center{ text-align:center; grid-column:2; }
  .header h1{ font-family:'BeyondWonderland', var(--sans); font-size:34px; font-weight:400; letter-spacing:0.03em; margin:0 0 6px; }
  .header p{ margin:0; color:var(--text-dim); font-size:13px; font-family:var(--mono); }
  .total-count{ margin-top:4px !important; color:var(--poc) !important; font-weight:600; }
  .header-actions{ display:flex; align-items:center; gap:8px; grid-column:3; justify-self:end; }
  @media (max-width:640px){
    #app{ padding:16px 14px 8px; }
    .header{ grid-template-columns:1fr; text-align:center; }
    .header-center{ grid-column:1; }
    .header h1{ font-size:24px; }
    .header-actions{ grid-column:1; justify-self:center; flex-wrap:wrap; justify-content:center; row-gap:8px; }
    .icon-link-btn{ width:32px; height:32px; }
    .add-btn{ padding:7px 12px; font-size:12px; }
    .icon-only-btn{ width:32px; height:32px; font-size:13px; }
    .brand-logo{ height:22px; }
    .card-collapsed-row{ flex-wrap:wrap; row-gap:6px; }
    .card-collapsed-row .meta-row{ flex-wrap:wrap; justify-content:flex-end; }
    .chip{ font-size:9px; padding:2px 6px; }
    .avatar{ width:36px; height:36px; font-size:13px; }
    .card-body{ flex-wrap:wrap; }
  }
  .add-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:border-color .15s, background .15s;
  }
  .add-btn:hover{ border-color:#3a3f4a; background:#252932; }
  .icon-only-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    width:36px; height:36px; border-radius:7px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; font-size:15px; transition:border-color .15s, background .15s;
  }
  .icon-only-btn:hover{ border-color:#3a3f4a; background:#252932; color:var(--text); }
  .icon-only-btn:disabled{ opacity:.5; cursor:default; }
  .icon-link-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    width:36px; height:36px; border-radius:7px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; text-decoration:none;
    transition:border-color .15s, background .15s, color .15s;
  }
  .icon-link-btn:hover{ border-color:#3a3f4a; background:#252932; color:var(--text); }
  .brand-logo{ height:26px; width:auto; display:block; margin-right:6px; }
  .sync-line{ margin:10px 0 14px; font-size:11px; font-family:var(--mono); color:var(--text-dim); display:flex; align-items:center; flex:0 0 auto; }
  .sync-dot{ width:6px;height:6px;border-radius:50%; display:inline-block; margin-right:6px; }
  .sync-dot.on{background:var(--poc);}
  .sync-dot.off{background:var(--text-dim);}
  .sync-dot.error{background:var(--danger);}
  .board{
    display:grid; grid-template-columns:repeat(4, minmax(240px,1fr)); gap:14px; align-items:start;
    flex:1 1 auto; min-height:0; overflow-y:auto; padding-right:4px; margin-right:-4px;
  }
  @media (max-width:900px){ .board{grid-template-columns:1fr;} }
  .column{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; min-height:120px; }
  .column.drag-over{ border-color:#4a4f5c; background:#1d2029; }

};

const COLUMNS = [

const STORAGE_KEY = 'impl-tracker:cards';
const AVATAR_COLORS = ['#5eead4','#fb923c','#a78bfa','#f472b6','#60a5fa','#facc15','#4ade80','#f87171'];

let cards = [];
let dragCardId = null;
let editingId = null;
let loaded = false;
let showSettings = false;
let showDebug = false;
let syncState = 'off'; // 'off' | 'ok' | 'error'
let debugLog = [];

// --- Auth / access-control state.
let currentUser = null;      // Firebase Auth user, or null if signed out
let userRole = null;         // null (unresolved) | 'editor' | 'viewer' | 'pending'
let editorsExist = false;    // whether any editor has been claimed yet (bootstrap gate)
let authBusy = false;
let authError = '';
let accessBusy = false;
let accessData = { pending: {}, viewers: {}, editors: {} };

function canEdit(){ return userRole === 'editor'; }

function logDebug(msg){
  const time = new Date().toLocaleTimeString();
  debugLog.unshift(`[${time}] ${msg}`);
  debugLog = debugLog.slice(0, 14);
}

function cryptoId(){ return 'c'+Math.random().toString(36).slice(2,10); }

function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/')){
      reject(new Error('Please choose an image file'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not load that image'));
      img.onload = () => {
        const size = maxSize || 64;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        // Fill white first — JPEG has no transparency, so without this,
        // logos with transparent backgrounds would get a black fill instead.
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        // Cover-fit: fill the square, cropping evenly, so logos of any
        // aspect ratio still look like a consistent icon.
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        // JPEG at moderate quality is dramatically smaller than PNG for
        // this use case — keeps the cloud-synced payload small and quick
        // to sync even with several cards carrying logos.
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function seedCards(){
  const now = new Date().toISOString();
  return [
    {id: cryptoId(), title:'Fraud check API', type:'poc', owner:'', client:'Acme Corp', domain:'acme.com', col:'poc',
      noteLog:[{id: cryptoId(), text:'Testing latency against vendor sandbox', at: now}]},
    {id: cryptoId(), title:'Client onboarding flow', type:'live', owner:'', client:'Globex', domain:'globex.com', col:'live',
      noteLog:[{id: cryptoId(), text:'Rolled out to 3 pilot clients', at: now}]},
  ];
}

// Cards saved before notes became a dated log had a single 'notes' string.
// Convert those into a one-entry log so old data keeps working, without
// ever touching timestamps on entries that already exist as log entries.
function migrateCards(list){
  return (list || []).map(c => {
    if(!Array.isArray(c.noteLog)){
      c.noteLog = c.notes ? [{id: cryptoId(), text: c.notes, at: c.updatedAt || new Date().toISOString()}] : [];
    }
    return c;
  });
}

// --- Firebase Realtime Database helpers. Plain REST calls against the
// database's HTTPS endpoint, authenticated with the signed-in user's
// Firebase ID token (?auth=<idToken>) so the security rules actually
// evaluate who's allowed to read/write, instead of a shared secret that
// bypasses every rule.
function fbDataUrl(path, token){
  const base = firebaseConfig.databaseURL.replace(/\/+$/, '');
  return `${base}/${path}.json?auth=${encodeURIComponent(token)}`;
}

async function getToken(forceRefresh){
  if(!currentUser) return null;
  return await currentUser.getIdToken(!!forceRefresh);
}

async function fbGet(path){
  const token = await getToken();
  const res = await fetch(fbDataUrl(path, token));
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Read failed: HTTP ' + res.status + (text ? ' — ' + text.slice(0,200) : ''));
  }
  return await res.json();
}

async function fbPut(path, value){
  const token = await getToken();
  const res = await fetch(fbDataUrl(path, token), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(value)
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Write failed: HTTP ' + res.status + (text ? ' — ' + text.slice(0,200) : ''));
  }
  return true;
}

async function fbDelete(path){
  const token = await getToken();
  const res = await fetch(fbDataUrl(path, token), { method: 'DELETE' });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Delete failed: HTTP ' + res.status + (text ? ' — ' + text.slice(0,200) : ''));
  }
  return true;
}

// --- Auth flow.
function initFirebase(){
  firebase.initializeApp(firebaseConfig);
  firebase.auth().onAuthStateChanged(onAuthChanged);
}

async function onAuthChanged(user){
  currentUser = user;
  authError = '';
  authBusy = false;
  if(!user){
    userRole = null;
    loaded = true;
    render();
    return;
  }
  loaded = false;
  render();
  await resolveRole();
}

async function resolveRole(){
  try{
    const editorsSnap = await fbGet('editors');
    editorsExist = !!(editorsSnap && Object.keys(editorsSnap).length > 0);
    if(editorsSnap && editorsSnap[currentUser.uid]){
      userRole = 'editor';
      await loadCards();
      return;
    }
    const viewerEntry = await fbGet('allowedViewers/' + currentUser.uid);
    if(viewerEntry){
      userRole = 'viewer';
      await loadCards();
      return;
    }
    userRole = 'pending';
    await fbPut('accessRequests/' + currentUser.uid, {
      email: currentUser.email || '',
      name: currentUser.displayName || '',
      requestedAt: new Date().toISOString()
    });
    loaded = true;
    render();
  }catch(e){
    authError = e.message || 'Could not check your access — try again.';
    loaded = true;
    render();
  }
}

async function claimAdminAccess(){
  authBusy = true;
  authError = '';
  render();
  try{
    await fbPut('editors/' + currentUser.uid, {
      email: currentUser.email || '',
      name: currentUser.displayName || '',
      addedAt: new Date().toISOString()
    });
    userRole = 'editor';
    editorsExist = true;
    authBusy = false;
    await loadCards();
  }catch(e){
    authBusy = false;
    authError = 'Could not claim admin access — someone may have just claimed it, or check your connection. (' + e.message + ')';
    loaded = true;
    render();
  }
}

function signIn(){
  authBusy = true;
  authError = '';
  render();
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(e => {
    authBusy = false;
    authError = e.message || 'Sign-in failed.';
    render();
  });
}

function signOutUser(){
  firebase.auth().signOut();
}

async function loadAccessData(){
  try{
    const [pending, viewers, editors] = await Promise.all([
      fbGet('accessRequests'),
      fbGet('allowedViewers'),
      fbGet('editors')
    ]);
    accessData = { pending: pending || {}, viewers: viewers || {}, editors: editors || {} };
  }catch(e){
    flashStatus('Could not load access list — ' + e.message);
  }
  render();
}

async function loadCards(){
  try{
    flashStatus('Syncing…');
    logDebug('READ cards');
    const record = await fbGet('cards');
    cards = migrateCards(Array.isArray(record) ? record : seedCards());
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    syncState = 'ok';
    logDebug('Read OK — ' + cards.length + ' card(s)');
    flashStatus('Synced from cloud');
  }catch(e){
    syncState = 'error';
    logDebug('Read FAILED — ' + e.message);
    const raw = localStorage.getItem(STORAGE_KEY);
    cards = migrateCards(raw ? JSON.parse(raw) : seedCards());
    flashStatus('Could not reach cloud — showing last saved copy');
  }
  loaded = true;
  render();
}

async function saveCards(){
  if(!canEdit()) return;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  try{
    flashStatus('Saving to cloud…');
    const payloadSize = new Blob([JSON.stringify(cards)]).size;
    logDebug('WRITE ' + cards.length + ' card(s), ~' + Math.round(payloadSize/1024) + 'KB');
    await fbPut('cards', cards);
    syncState = 'ok';
    logDebug('Write OK');
    flashStatus('Saved to cloud');
    render();
  }catch(e){
    syncState = 'error';
    logDebug('Write FAILED — ' + e.message);
    flashStatus('Saved locally — could not reach cloud');
    render();
  }
}

let statusTimer;
function flashStatus(msg){
  const el = document.getElementById('status-msg');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}

function openModal(id){ if(!canEdit()) return; editingId = id || null; render(); }
function closeModal(){ editingId = null; render(); }

function upsertCard(data){
  if(!canEdit()) return;
  const stamped = { ...data, updatedAt: new Date().toISOString() };
  if(editingId && editingId !== 'new'){
    cards = cards.map(c => c.id === editingId ? {...c, ...stamped} : c);
  } else {
    cards.push({id: cryptoId(), col:'backlog', ...stamped});
  }
  saveCards();
  closeModal();
}

let expandedCards = new Set();
let addingNoteId = null;
let deleteConfirmId = null;
function toggleExpand(id){
  if(expandedCards.has(id)){
    expandedCards.delete(id);
    if(addingNoteId === id) addingNoteId = null;
  } else {
    expandedCards.add(id);
  }
  render();
}

function addNoteToCard(id, text){
  if(!canEdit()) return;
  cards = cards.map(c => {
    if(c.id !== id) return c;
    const noteLog = Array.isArray(c.noteLog) ? [...c.noteLog] : [];
    noteLog.push({id: cryptoId(), text, at: new Date().toISOString()});
    return {...c, noteLog, updatedAt: new Date().toISOString()};
  });
  saveCards();
}

function openDeleteConfirm(id){ if(!canEdit()) return; deleteConfirmId = id; render(); }
function closeDeleteConfirm(){ deleteConfirmId = null; render(); }

function deleteCard(id){
  if(!canEdit()) return;
  cards = cards.filter(c => c.id !== id);
  if(addingNoteId === id) addingNoteId = null;
  if(deleteConfirmId === id) deleteConfirmId = null;
  saveCards();
  closeModal();
}

function moveCard(id, col){
  if(!canEdit()) return;
  cards = cards.map(c => c.id === id ? {...c, col} : c);
  saveCards();
  render();
}

function colorForName(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function initialsForName(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
const RAG_LABELS = {green:'Green', amber:'Amber', red:'Red'};
function renderRagDot(card){
  if(!card.ragStatus || !RAG_LABELS[card.ragStatus]) return '';
  return `<span class="rag-dot rag-${card.ragStatus}" title="RAG: ${RAG_LABELS[card.ragStatus]}"></span>`;
}

function renderAvatar(card){
  const client = (card.client || '').trim();
  if(!client && !card.logo) return '';
  const initials = initialsForName(client || '?');
  const bg = colorForName(client || 'x');
  if(card.logo){
    // Uploaded image — always available, no need for a fallback underneath.
    return `<div class="avatar" style="background:transparent" title="${escapeAttr(client)}"><img src="${card.logo}" alt=""></div>`;
  }
  const domain = (card.domain || '').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  if(domain){
    // Auto-fetched logo — if it fails to load, remove it so initials show through.
    return `<div class="avatar" style="background:${bg}" title="${escapeAttr(client)}"><img src="https://logo.clearbit.com/${escapeAttr(domain)}?size=64" alt="" onerror="this.remove()"><span>${initials}</span></div>`;
  }
  return `<div class="avatar" style="background:${bg}" title="${escapeAttr(client)}"><span>${initials}</span></div>`;
}

function renderSignInGate(){
  return `
    <div class="auth-gate">
      <div class="auth-card">
        <h1>Jitronix Delivery Engine</h1>
        <p class="sub">Sign in with your Google account to view or edit this board.</p>
        ${authError ? `<p class="auth-error">${escapeHtml(authError)}</p>` : ''}
        <button class="btn primary" id="signin-btn" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Signing in…' : 'Sign in with Google'}</button>
      </div>
    </div>
  `;
}
function wireSignInGate(){
  const btn = document.getElementById('signin-btn');
  if(btn) btn.onclick = signIn;
}

function renderPendingGate(){
  return `
    <div class="auth-gate">
      <div class="auth-card">
        <h1>Access requested</h1>
        <p class="sub">Signed in as <strong>${escapeHtml(currentUser.email || '')}</strong>. Ask the board owner to approve your access — come back and check again once they have.</p>
        ${authError ? `<p class="auth-error">${escapeHtml(authError)}</p>` : ''}
        ${!editorsExist ? `
          <p class="field-hint" style="margin-bottom:10px;">No one has claimed admin access yet. If that's supposed to be you:</p>
          <button class="btn primary" id="claim-admin-btn" ${authBusy ? 'disabled' : ''} style="margin-bottom:14px;">${authBusy ? 'Claiming…' : 'Claim admin access'}</button>
        ` : ''}
        <div style="display:flex; gap:8px; justify-content:center;">
          <button class="btn" id="pending-refresh-btn">Check again</button>
          <button class="btn" id="pending-signout-btn">Sign out</button>
        </div>
      </div>
    </div>
  `;
}
function wirePendingGate(){
  const claimBtn = document.getElementById('claim-admin-btn');
  if(claimBtn) claimBtn.onclick = claimAdminAccess;
  document.getElementById('pending-refresh-btn').onclick = () => { loaded = false; render(); resolveRole(); };
  document.getElementById('pending-signout-btn').onclick = signOutUser;
}

function render(){
  const app = document.getElementById('app');

  if(!currentUser){
    app.innerHTML = renderSignInGate();
    wireSignInGate();
    return;
  }

  if(!loaded){
    app.innerHTML = `<div style="color:var(--text-dim);font-family:var(--mono);font-size:13px;padding:40px;">Loading…</div>`;
    return;
  }

  if(userRole === 'pending'){
    app.innerHTML = renderPendingGate();
    wirePendingGate();
    return;

        ${authError ? `<p class="auth-error">${escapeHtml(authError)}</p>` : ''}
        <button class="btn" id="checking-retry-btn">Retry</button>
        <button class="btn" id="checking-signout-btn" style="margin-left:8px;">Sign out</button>
      </div>`;
    document.getElementById('checking-retry-btn').onclick = () => { loaded = false; authError=''; render(); resolveRole(); };
    document.getElementById('checking-signout-btn').onclick = signOutUser;

        <a class="icon-link-btn" href="${escapeAttr(CONFLUENCE_PAGE_URL)}" target="_blank" rel="noopener noreferrer" title="Confluence"><svg viewBox="0 0 24 24" width="16" height="16" fill="#2684FF" aria-hidden="true"><path d="M.87 18.257c-.248.382-.53.875-.763 1.245a.764.764 0 0 0 .255 1.04l4.965 3.054a.764.764 0 0 0 1.058-.26c.199-.332.454-.763.733-1.221 1.967-3.247 3.945-2.853 7.508-1.146l4.957 2.337a.764.764 0 0 0 1.028-.382l2.364-5.346a.764.764 0 0 0-.382-1 599.851 599.851 0 0 1-4.965-2.361C10.911 10.97 5.224 11.185.87 18.257zM23.131 5.743c.249-.405.531-.875.764-1.25a.764.764 0 0 0-.256-1.034L18.675.404a.764.764 0 0 0-1.058.26c-.195.335-.451.763-.734 1.225-1.966 3.246-3.945 2.85-7.508 1.146L4.437.694a.764.764 0 0 0-1.027.382L1.046 6.422a.764.764 0 0 0 .382 1c1.039.49 3.105 1.467 4.965 2.361 6.698 3.246 12.392 3.029 16.738-4.04z"/></svg></a>
        <button class="icon-only-btn" id="refresh-btn" title="Refresh from cloud">⟳</button>
        <button class="icon-only-btn" id="settings-btn" title="${canEdit() ? 'Manage access' : 'Account'}">⚙</button>
        ${canEdit() ? `<button class="add-btn" id="add-btn">+ New implementation</button>` : ''}
      </div>
    </div>
    <div class="sync-line"><span class="sync-dot ${dotClass}"></span>${syncLabel}${roleChip}</div>
    <div class="board">
      ${COLUMNS.map(colDef => renderColumn(colDef)).join('')}
    </div>
    <div class="footer-banner">
      <div class="marquee-lights">${Array.from({length:5}).map((_,i)=>`<span style="animation-delay:${i*0.15}s"></span>`).join('')}</div>
      <span class="footer-text">The show must go on...</span>
      <div class="marquee-lights">${Array.from({length:5}).map((_,i)=>`<span style="animation-delay:${i*0.15}s"></span>`).join('')}</div>
    </div>
    <div class="status-msg" id="status-msg"></div>
    ${editingId !== null ? renderModal(editing) : ''}
    ${showSettings ? renderSettings() : ''}
    ${deleteConfirmId ? renderDeleteConfirm() : ''}
  `;

  const addBtnEl = document.getElementById('add-btn');
  if(addBtnEl) addBtnEl.onclick = () => { editingId = 'new'; render(); };
  document.getElementById('refresh-btn').onclick = async () => { loaded = false; render(); await loadCards(); };
  document.getElementById('settings-btn').onclick = () => {
    showSettings = true;
    render();
    if(canEdit()) loadAccessData();
  };

  document.querySelectorAll('.card').forEach(el=>{
    const id = el.dataset.id;
    el.addEventListener('dragstart', (e) => {
      if(!canEdit() || e.target.closest('.note-add-form')){ e.preventDefault(); return; }
      dragCardId = id; el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('click', (e) => {
      if(e.target.closest('.icon-btn') || e.target.closest('.note-add-form')) return;
      toggleExpand(id);
    });
  });
  document.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(btn.dataset.id); });
  });
  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openDeleteConfirm(btn.dataset.id); });
  });
  document.querySelectorAll('.add-note-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      addingNoteId = btn.dataset.addNote;
      render();
      const ta = document.getElementById('note-add-text-' + addingNoteId);
      if(ta) ta.focus();
    });
  });
  document.querySelectorAll('[data-cancel-note]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      addingNoteId = null;
      render();
    });
  });
  document.querySelectorAll('[data-save-note]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.saveNote;
      const ta = document.getElementById('note-add-text-' + id);
      const text = ta ? ta.value.trim() : '';
      if(!text){ flashStatus('Type a note before saving'); return; }
      addingNoteId = null;
      addNoteToCard(id, text);
      render();
    });
  });
  document.querySelectorAll('.note-add-textarea').forEach(ta=>{
    ta.addEventListener('click', (e) => e.stopPropagation());
    ta.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
        e.preventDefault();
        const form = ta.closest('.note-add-form');
        const saveBtn = form && form.querySelector('[data-save-note]');
        if(saveBtn) saveBtn.click();
      }
    });
  });
  if(canEdit()){
    document.querySelectorAll('.column').forEach(colEl=>{
      colEl.addEventListener('dragover', e=>{ e.preventDefault(); colEl.classList.add('drag-over'); });
      colEl.addEventListener('dragleave', ()=> colEl.classList.remove('drag-over'));
      colEl.addEventListener('drop', e=>{
        e.preventDefault(); colEl.classList.remove('drag-over');
        if(dragCardId) moveCard(dragCardId, colEl.dataset.col);
        dragCardId = null;
      });
    });
  }

  if(editingId !== null) setupModalHandlers(editing);
  if(showSettings) setupSettingsHandlers();
  if(deleteConfirmId) setupDeleteConfirmHandlers();
}

function renderColumn(colDef){
  const colCards = cards.filter(c => c.col === colDef.id);
  return `
    <div class="column" data-col="${colDef.id}">
      <div class="col-head">
        <span class="col-title">${colDef.title}</span>
        <span class="col-count">${colCards.length}</span>
      </div>
      ${colCards.length === 0 ? `<div class="empty-hint">No cards yet</div>` : ''}
      ${colCards.map(renderCard).join('')}
    </div>
  `;
}

function ensureUrl(url){
  if(!url) return '';
  if(!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

function formatTimestamp(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function renderCard(card){
  const isLive = card.type === 'live';
  const isExpanded = expandedCards.has(card.id);
  const displayName = card.client || card.title;

  if(!isExpanded){
    return `
      <div class="card collapsed" draggable="${canEdit() ? 'true' : 'false'}" data-id="${card.id}">
        <div class="card-collapsed-row">
          <span class="collapsed-name">${renderRagDot(card)}<span class="collapsed-name-text">${escapeHtml(displayName)}</span></span>
          ${(card.modules && card.modules.length) || card.infraType ? `
            <div class="meta-row" style="margin:0; flex:0 0 auto;">
              ${(card.modules||[]).map(m => `<span class="chip">${escapeHtml(m)}</span>`).join('')}
              ${card.infraType ? `<span class="chip infra">${escapeHtml(card.infraType)}</span>` : ''}
            </div>
          ` : ''}
          ${renderAvatar(card)}
        </div>
      </div>
    `;
  }

  const noteLog = Array.isArray(card.noteLog)
    ? [...card.noteLog].sort((a,b) => new Date(b.at) - new Date(a.at))
    : [];

  return `
    <div class="card expanded" draggable="${canEdit() ? 'true' : 'false'}" data-id="${card.id}">
      <div class="card-top">
        <span class="badge ${card.type}">${isLive ? '<span class="pulse"></span>Live Implementations' : 'POC'}</span>
        ${canEdit() ? `
        <div class="card-actions">
          <button class="icon-btn edit-btn" data-id="${card.id}" title="Edit">✎</button>
          <button class="icon-btn del-btn" data-id="${card.id}" title="Delete">✕</button>
        </div>
        ` : ''}
      </div>
      <div class="card-body">
        <div class="card-main">
          <p class="card-title">${escapeHtml(card.title)}</p>
          ${card.client ? `<p class="owner" style="margin:0 0 6px; display:flex; align-items:center;">${renderRagDot(card)}${escapeHtml(card.client)}</p>` : ''}
          ${(card.modules && card.modules.length) || card.infraType ? `
            <div class="meta-row">
              ${(card.modules||[]).map(m => `<span class="chip">${escapeHtml(m)}</span>`).join('')}
              ${card.infraType ? `<span class="chip infra">${escapeHtml(card.infraType)}</span>` : ''}
            </div>
          ` : ''}
          ${(card.links && card.links.length) ? `
            <div class="card-links">
              ${card.links.map(l => `<a href="${escapeAttr(ensureUrl(l.url))}" target="_blank" rel="noopener" class="card-link" onclick="event.stopPropagation()">🔗 ${escapeHtml(l.name)}</a>`).join('')}
            </div>
          ` : ''}
          ${canEdit() ? renderNoteAdder(card) : ''}
          ${noteLog.map(n => `
            <div class="note-entry-view">
              <p class="card-notes">${escapeHtml(n.text)}</p>
              <p class="note-timestamp">${formatTimestamp(n.at)}</p>
            </div>
          `).join('')}
          ${card.owner ? `<div class="card-foot"><span class="owner">${escapeHtml(card.owner)}</span></div>` : ''}
        </div>
        ${renderAvatar(card)}
      </div>
    </div>
  `;
}

function setupModalHandlers(editing){
  let currentType = (editing && editing.type) || 'poc';
  let currentLogo = (editing && editing.logo) || '';
  let currentModules = (editing && Array.isArray(editing.modules)) ? [...editing.modules] : [];
  let currentInfra = (editing && editing.infraType) || '';
  let linkDraft = (editing && Array.isArray(editing.links)) ? [...editing.links] : [];
  let noteLogDraft = (editing && Array.isArray(editing.noteLog)) ? [...editing.noteLog] : [];
  let currentRag = (editing && editing.ragStatus) || '';

  function renderLinkList(){
    const container = document.getElementById('link-list');
    if(!container) return;
    if(linkDraft.length === 0){
      container.innerHTML = `<p class="field-hint">No links added yet.</p>`;
      return;
    }
    container.innerHTML = linkDraft.map(l => `
      <div class="note-entry" data-link-id="${l.id}" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <a href="${escapeAttr(ensureUrl(l.url))}" target="_blank" rel="noopener" style="color:var(--poc); font-size:12px; text-decoration:none; word-break:break-word;">🔗 ${escapeHtml(l.name)}</a>
        <button type="button" class="icon-btn link-del" data-link-id="${l.id}" title="Remove link">✕</button>
      </div>
    `).join('');
    container.querySelectorAll('.link-del').forEach(btn=>{
      btn.addEventListener('click', () => {
        linkDraft = linkDraft.filter(l => l.id !== btn.dataset.linkId);
        renderLinkList();
      });
    });
  }
  renderLinkList();

  document.getElementById('add-link-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('f-link-name');
    const urlInput = document.getElementById('f-link-url');
    const name = nameInput.value.trim();
    const url = urlInput.value.trim();
    if(!name || !url){ flashStatus('Enter both a name and a link'); return; }
    linkDraft.push({id: cryptoId(), name, url: ensureUrl(url)});
    nameInput.value = '';
    urlInput.value = '';
    renderLinkList();
  });

  document.querySelectorAll('.module-btn').forEach(btn=>{
    btn.addEventListener('click', () => {
      const m = btn.dataset.module;
      if(currentModules.includes(m)){
        currentModules = currentModules.filter(x => x !== m);
        btn.classList.remove('active','poc');
      } else {
        currentModules.push(m);
        btn.classList.add('active','poc');
      }
    });
  });

  document.querySelectorAll('.rag-btn').forEach(btn=>{
    btn.addEventListener('click', () => {
      const val = btn.dataset.rag;
      document.querySelectorAll('.rag-btn').forEach(b => b.classList.remove('active','rag-green-active','rag-amber-active','rag-red-active'));
      if(currentRag === val){
        currentRag = '';
      } else {
        currentRag = val;
        btn.classList.add('active', `rag-${val}-active`);
      }
    });
  });

  document.querySelectorAll('.infra-btn').forEach(btn=>{
    btn.addEventListener('click', () => {
      const val = btn.dataset.infra;
      document.querySelectorAll('.infra-btn').forEach(b => b.classList.remove('active','poc','live'));
      if(currentInfra === val){
        currentInfra = '';
      } else {
        currentInfra = val;
        btn.classList.add('active', val === 'SaaS' ? 'poc' : 'live');
      }
    });
  });

  function renderNoteHistory(){
    const container = document.getElementById('note-history');
    if(!container) return;
    if(noteLogDraft.length === 0){
      container.innerHTML = `<p class="field-hint">No notes yet — add one above.</p>`;
      return;
    }
    const sorted = [...noteLogDraft].sort((a,b) => new Date(b.at) - new Date(a.at));
    container.innerHTML = sorted.map(n => `
      <div class="note-entry" data-note-id="${n.id}">
        <p class="note-entry-text">${escapeHtml(n.text)}</p>
        <div class="note-entry-meta">
          <span>${formatTimestamp(n.at)}</span>
          <button type="button" class="icon-btn note-del" data-note-id="${n.id}" title="Delete this note">✕</button>
        </div>
      </div>
    `).join('');
    container.querySelectorAll('.note-del').forEach(btn=>{
      btn.addEventListener('click', () => {
        const noteId = btn.dataset.noteId;
        noteLogDraft = noteLogDraft.filter(n => n.id !== noteId);
        renderNoteHistory();
      });
    });
  }
  renderNoteHistory();

  document.querySelectorAll('.type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentType = btn.dataset.type;
      document.querySelectorAll('.type-btn').forEach(b=> b.classList.remove('active','poc','live'));
      btn.classList.add('active', currentType);
    });
  });

  function refreshLogoPreview(){
    const preview = document.getElementById('logo-preview');
    const removeBtn = document.getElementById('f-logo-remove');
    const clientName = document.getElementById('f-client').value.trim() || '?';
    if(currentLogo){
      preview.style.background = 'transparent';
      preview.innerHTML = `<img src="${currentLogo}" alt="">`;
      if(removeBtn) removeBtn.style.display = '';
    } else {
      preview.style.background = colorForName(clientName);
      preview.innerHTML = `<span>${initialsForName(clientName)}</span>`;
      if(removeBtn) removeBtn.style.display = 'none';
    }
  }

  const fileInput = document.getElementById('f-logo-file');
  if(fileInput){
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        flashStatus('Processing image…');
        currentLogo = await resizeImageToDataUrl(file, 64);
        refreshLogoPreview();
        flashStatus('Logo ready');
      }catch(err){
        flashStatus(err.message || 'Could not process that image');
      }
    });
  }
  const removeBtn = document.getElementById('f-logo-remove');
  if(removeBtn){
    removeBtn.addEventListener('click', () => {
      currentLogo = '';
      refreshLogoPreview();
    });
  }
  const clientInput = document.getElementById('f-client');
  if(clientInput){
    clientInput.addEventListener('input', () => { if(!currentLogo) refreshLogoPreview(); });
  }

  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('modal-cancel').onclick = closeModal;
  if(document.getElementById('modal-delete')){
    document.getElementById('modal-delete').onclick = () => {
      editingId = null;
      deleteConfirmId = editing.id;
      render();
    };
  }
  document.getElementById('modal-save').onclick = () => {
    const title = document.getElementById('f-title').value.trim();
    if(!title){ document.getElementById('f-title').focus(); return; }
    const newNoteText = document.getElementById('f-notes').value.trim();
    const owner = document.getElementById('f-owner').value.trim();
    const client = document.getElementById('f-client').value.trim();
    const domain = document.getElementById('f-domain').value.trim();
    let finalLog = [...noteLogDraft];
    if(newNoteText){
      finalLog.push({id: cryptoId(), text: newNoteText, at: new Date().toISOString()});
    }
    upsertCard({title, owner, client, domain, logo: currentLogo, type: currentType, noteLog: finalLog, modules: currentModules, infraType: currentInfra, links: linkDraft, ragStatus: currentRag});
  };
}

  return `

function setupDeleteConfirmHandlers(){
  const overlay = document.getElementById('delete-confirm-overlay');
  const input = document.getElementById('delete-confirm-input');
  const okBtn = document.getElementById('delete-confirm-ok');
  const cancelBtn = document.getElementById('delete-confirm-cancel');

  overlay.addEventListener('click', (e)=>{ if(e.target.id === 'delete-confirm-overlay') closeDeleteConfirm(); });
  cancelBtn.onclick = closeDeleteConfirm;

  function refreshOkState(){
    okBtn.disabled = input.value.trim().toLowerCase() !== 'delete';
  }
  input.addEventListener('input', refreshOkState);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !okBtn.disabled) okBtn.click();
  });
  okBtn.onclick = () => {
    if(input.value.trim().toLowerCase() !== 'delete') return;
    const id = deleteConfirmId;
    deleteCard(id);
  };
  input.focus();
}

function renderAccessPanel(){
  const pending = accessData.pending || {};
  const viewers = accessData.viewers || {};

  const pendingEntries = Object.entries(pending);
  const viewerEntries = Object.entries(viewers);
  const editorEntries = Object.entries(editors);

  return `
    <div class="overlay" id="settings-overlay">
      <div class="modal" style="max-width:540px;">
        <h2>Manage access</h2>
        <p class="sub">Signed in as <strong>${escapeHtml(currentUser.email || '')}</strong> (editor).</p>

        <div class="field">
          <label>Pending requests${pendingEntries.length ? ` (${pendingEntries.length})` : ''}</label>
          ${pendingEntries.length === 0 ? `<p class="field-hint">No one is waiting for approval.</p>` : `
            <div class="note-history">
              ${pendingEntries.map(([uid, req]) => `
                <div class="access-row" data-uid="${escapeAttr(uid)}">
                  <div class="access-row-info">
                    <div class="access-row-email">${escapeHtml(req.email || uid)}</div>
                    <div class="access-row-meta">requested ${formatTimestamp(req.requestedAt)}</div>
                  </div>
                  <div class="access-row-actions">
                    <button type="button" class="btn primary small" data-approve-viewer="${escapeAttr(uid)}">Approve viewer</button>
                    <button type="button" class="btn small" data-make-editor="${escapeAttr(uid)}">Make editor</button>
                    <button type="button" class="btn delete small" data-dismiss-request="${escapeAttr(uid)}">Dismiss</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="field">
          <label>Approved viewers${viewerEntries.length ? ` (${viewerEntries.length})` : ''}</label>
          ${viewerEntries.length === 0 ? `<p class="field-hint">No approved viewers yet.</p>` : `
            <div class="note-history">
              ${viewerEntries.map(([uid, v]) => `
                <div class="access-row" data-uid="${escapeAttr(uid)}">
                  <div class="access-row-info">
                    <div class="access-row-email">${escapeHtml(v.email || uid)}</div>
                    <div class="access-row-meta">approved ${formatTimestamp(v.approvedAt)}</div>
                  </div>
                  <div class="access-row-actions">
                    <button type="button" class="btn small" data-promote-editor="${escapeAttr(uid)}">Make editor</button>
                    <button type="button" class="btn delete small" data-revoke-viewer="${escapeAttr(uid)}">Revoke</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="field">
          <label>Editors${editorEntries.length ? ` (${editorEntries.length})` : ''}</label>
          <div class="note-history">
            ${editorEntries.map(([uid, e]) => `
              <div class="access-row" data-uid="${escapeAttr(uid)}">
                <div class="access-row-info">
                  <div class="access-row-email">${escapeHtml(e.email || uid)}${currentUser && uid === currentUser.uid ? ' (you)' : ''}</div>
                  <div class="access-row-meta">added ${formatTimestamp(e.addedAt)}</div>
                </div>
                ${editorEntries.length > 1 ? `
                  <div class="access-row-actions">
                    <button type="button" class="btn delete small" data-revoke-editor="${escapeAttr(uid)}">Revoke</button>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        ${renderSizeIndicator()}
        ${accessBusy ? `<p class="field-hint">Working…</p>` : ''}

        <div class="modal-actions">
          <div></div>
          <div style="display:flex; gap:8px;">
            <button class="btn" id="settings-cancel">Close</button>
            <button class="btn delete" id="settings-signout">Sign out</button>
          </div>
        </div>
        <div class="debug-toggle" id="debug-toggle">${showDebug ? 'Hide' : 'Show'} activity log</div>
        ${showDebug ? `<div class="debug-box">${debugLog.length ? escapeHtml(debugLog.join('\\n')) : 'No activity yet.'}</div>` : ''}
      </div>
    </div>
  `;
}

function setupSettingsHandlers(){
  document.getElementById('settings-overlay').addEventListener('click', (e)=>{
    if(e.target.id === 'settings-overlay'){ showSettings = false; render(); }
  });
  document.getElementById('settings-cancel').onclick = () => { showSettings = false; render(); };
  document.getElementById('settings-signout').onclick = () => { showSettings = false; signOutUser(); };

  if(!canEdit()) return;

  const debugToggle = document.getElementById('debug-toggle');
  if(debugToggle) debugToggle.onclick = () => { showDebug = !showDebug; render(); };

  async function withBusy(fn){
    accessBusy = true;
    render();
    try{ await fn(); }
    catch(e){ logDebug('Access action FAILED — ' + e.message); flashStatus(e.message || 'Something went wrong'); }
    accessBusy = false;
    await loadAccessData();
  }

  document.querySelectorAll('[data-approve-viewer]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const uid = btn.dataset.approveViewer;
      const req = accessData.pending[uid] || {};
      withBusy(async () => {
        await fbPut('allowedViewers/' + uid, { email: req.email || '', name: req.name || '', approvedAt: new Date().toISOString() });
        await fbDelete('accessRequests/' + uid);
        logDebug('Approved viewer: ' + (req.email || uid));
      });
    });
  });
  document.querySelectorAll('[data-make-editor]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const uid = btn.dataset.makeEditor;
      const req = accessData.pending[uid] || {};
      withBusy(async () => {
        await fbPut('editors/' + uid, { email: req.email || '', name: req.name || '', addedAt: new Date().toISOString() });
        await fbDelete('accessRequests/' + uid);
        logDebug('Made editor: ' + (req.email || uid));
      });
    });
  });
  document.querySelectorAll('[data-dismiss-request]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const uid = btn.dataset.dismissRequest;
      withBusy(async () => {
        await fbDelete('accessRequests/' + uid);
        logDebug('Dismissed request: ' + uid);
      });
    });
  });
  document.querySelectorAll('[data-promote-editor]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const uid = btn.dataset.promoteEditor;
      const v = accessData.viewers[uid] || {};
      withBusy(async () => {
        await fbPut('editors/' + uid, { email: v.email || '', name: v.name || '', addedAt: new Date().toISOString() });
        await fbDelete('allowedViewers/' + uid);
        logDebug('Promoted to editor: ' + (v.email || uid));
      });
    });
  });
  document.querySelectorAll('[data-revoke-viewer]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const uid = btn.dataset.revokeViewer;
      if(!confirm('Revoke read access for this person?')) return;
      withBusy(async () => {
        await fbDelete('allowedViewers/' + uid);
        logDebug('Revoked viewer: ' + uid);
      });
    });
  });
  document.querySelectorAll('[data-revoke-editor]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const uid = btn.dataset.revokeEditor;
      if(Object.keys(accessData.editors || {}).length <= 1){ flashStatus('Cannot remove the last editor'); return; }
      if(!confirm('Revoke editor access for this person?')) return;
      withBusy(async () => {
        await fbDelete('editors/' + uid);
        logDebug('Revoked editor: ' + uid);
      });
    });
  });
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

initFirebase();
</script>
