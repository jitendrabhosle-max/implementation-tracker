<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Project Dashboard</title>
<style>
  :root{
    --bg:#12141a;
    --surface:#1a1d24;
    --surface-2:#20242c;
    --border:#2b2f38;
    --text:#e7e9ee;
    --text-dim:#8b9099;
    --poc:#5eead4;
    --poc-dim:#1b3a37;
    --live:#fb923c;
    --live-dim:#3a2818;
    --danger:#f16a6a;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:var(--sans);}
  #app{ background:var(--bg); min-height:100vh; padding:28px 24px 60px; }
  .header{ display:grid; grid-template-columns:1fr auto 1fr; align-items:flex-start; margin-bottom:8px; gap:16px; }
  .header-center{ text-align:center; grid-column:2; }
  .header h1{ font-size:20px; font-weight:600; letter-spacing:-0.01em; margin:0 0 4px; }
  .header p{ margin:0; color:var(--text-dim); font-size:13px; font-family:var(--mono); }
  .total-count{ margin-top:4px !important; color:var(--poc) !important; font-weight:600; }
  .header-actions{ display:flex; align-items:center; gap:8px; grid-column:3; justify-self:end; }
  @media (max-width:640px){
    .header{ grid-template-columns:1fr; text-align:center; }
    .header-center{ grid-column:1; }
    .header-actions{ grid-column:1; justify-self:center; }
  }
  .add-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:border-color .15s, background .15s;
  }
  .add-btn:hover{ border-color:#3a3f4a; background:#252932; }
  .icon-only-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    width:36px; height:36px; border-radius:7px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; font-size:15px; transition:border-color .15s, background .15s;
  }
  .icon-only-btn:hover{ border-color:#3a3f4a; background:#252932; color:var(--text); }
  .icon-only-btn:disabled{ opacity:.5; cursor:default; }
  .sync-line{ margin:10px 0 18px; font-size:11px; font-family:var(--mono); color:var(--text-dim); display:flex; align-items:center; }
  .sync-dot{ width:6px;height:6px;border-radius:50%; display:inline-block; margin-right:6px; }
  .sync-dot.on{background:var(--poc);}
  .sync-dot.off{background:var(--text-dim);}
  .sync-dot.error{background:var(--danger);}
  .board{ display:grid; grid-template-columns:repeat(4, minmax(240px,1fr)); gap:14px; align-items:start; }
  @media (max-width:900px){ .board{grid-template-columns:1fr;} }
  .column{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; min-height:120px; }
  .column.drag-over{ border-color:#4a4f5c; background:#1d2029; }
  .col-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 4px 12px; }
  .col-title{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); }
  .col-count{ font-family:var(--mono); font-size:11px; color:var(--text-dim); background:var(--surface-2); border-radius:5px; padding:1px 6px; }
  .card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:12px 12px 10px; margin-bottom:9px; cursor:pointer; transition:border-color .15s;
  }
  .card.collapsed{ padding:10px 12px; cursor:pointer; }
  .card-collapsed-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .collapsed-name{ font-size:13px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .card[draggable="true"]:active{cursor:grabbing;}
  .card:hover{border-color:#3a3f4a;}
  .card.dragging{opacity:.4;}
  .card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .card-top-left{ display:flex; align-items:center; gap:7px; min-width:0; }
  .card-body{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-main{ flex:1; min-width:0; }
  .avatar{
    width:44px; height:44px; border-radius:10px; flex:0 0 auto; display:flex;
    align-items:center; justify-content:center; font-family:var(--mono); font-size:16px;
    font-weight:700; color:#0c0d10; overflow:hidden; position:relative; background:#6b7280;
  }
  .note-entry-view{ margin-bottom:8px; }
  .note-entry-view:last-child{ margin-bottom:0; }
  .note-timestamp{
    font-size:10px; color:var(--text-dim); font-family:var(--mono);
    margin:0 0 2px; opacity:.8;
  }
  .avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#fff; z-index:1; }
  .avatar span{ position:relative; z-index:0; }
  .badge{
    font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.03em;
    padding:2px 7px; border-radius:5px; display:inline-flex; align-items:center; gap:5px;
  }
  .badge.poc{background:var(--poc-dim);color:var(--poc);}
  .badge.live{background:var(--live-dim);color:var(--live);}
  .pulse{ width:6px;height:6px;border-radius:50%; background:var(--live); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(251,146,60,.5);} 50%{opacity:.6; box-shadow:0 0 0 4px rgba(251,146,60,0);} }
  .card-title{ font-size:13.5px; font-weight:500; line-height:1.35; margin:0 0 4px; word-break:break-word; }
  .card-notes{ font-size:12px; color:var(--text-dim); line-height:1.4; margin:0 0 8px; white-space:pre-wrap; word-break:break-word; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; }
  .owner{ font-size:11px; color:var(--text-dim); font-family:var(--mono); }
  .card-actions{ display:flex; gap:6px; opacity:0; transition:opacity .12s; }
  .card:hover .card-actions{opacity:1;}
  .icon-btn{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; padding:2px 4px; border-radius:4px; }
  .icon-btn:hover{color:var(--text); background:var(--border);}
  .empty-hint{ color:var(--text-dim); font-size:12px; font-family:var(--mono); padding:8px 4px 2px; }
  .overlay{ position:fixed;inset:0; background:rgba(8,9,12,.6); display:flex;align-items:center;justify-content:center; z-index:50; padding:20px; overflow-y:auto; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:460px; padding:20px; margin:auto; }
  .modal h2{ font-size:15px; margin:0 0 6px; font-weight:600; }
  .modal .sub{ font-size:12px; color:var(--text-dim); margin:0 0 16px; line-height:1.5; }
  .field{margin-bottom:12px;}
  .field label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.04em; }
  .field input, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:7px; font-size:13px; font-family:var(--sans);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field-hint{ font-size:11px; color:var(--text-dim); margin-top:5px; line-height:1.4; }
  .note-history{ margin-top:4px; max-height:180px; overflow-y:auto; }
  .note-entry{ background:var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:8px 10px; margin-bottom:6px; }
  .note-entry:last-child{ margin-bottom:0; }
  .note-entry-text{ font-size:12px; color:var(--text); line-height:1.4; white-space:pre-wrap; word-break:break-word; margin:0 0 4px; }
  .note-entry-meta{ display:flex; align-items:center; justify-content:space-between; font-size:10px; color:var(--text-dim); font-family:var(--mono); }
  .card-links{ display:flex; flex-direction:column; gap:4px; margin:2px 0 8px; }
  .card-link{ font-size:11px; color:var(--poc); text-decoration:none; font-family:var(--mono); word-break:break-word; }
  .card-link:hover{ text-decoration:underline; }
  .meta-row{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 8px; }
  .card-collapsed-row .meta-row{ flex-wrap:nowrap; }
  .chip{ font-family:var(--mono); font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); }
  .chip.infra{ color:var(--poc); border-color:var(--poc-dim); }
  .field-row{ display:flex; gap:8px; align-items:flex-end; }
  .field-row .field{flex:1; margin-bottom:0;}
  .type-toggle{display:flex; gap:8px;}
  .type-toggle button{
    flex:1; padding:8px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-dim); font-size:12px; font-weight:600; font-family:var(--mono); cursor:pointer;
  }
  .type-toggle button.active.poc{background:var(--poc-dim); color:var(--poc); border-color:var(--poc);}
  .type-toggle button.active.live{background:var(--live-dim); color:var(--live); border-color:var(--live);}
  .modal-actions{ display:flex; justify-content:space-between; margin-top:18px; }
  .btn{ padding:8px 16px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--surface-2); color:var(--text); }
  .btn.primary{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .btn.delete{ background:none; border:none; color:var(--danger); font-size:12px; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .status-msg{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    font-family:var(--mono); font-size:11px; padding:6px 12px; border-radius:20px;
    opacity:0; transition:opacity .3s; pointer-events:none; max-width:80vw; text-align:center;
  }
  .status-msg.show{opacity:1;}
  .debug-box{
    margin-top:14px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:10px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); max-height:140px;
    overflow-y:auto; white-space:pre-wrap; word-break:break-word;
  }
  .debug-toggle{ font-size:11px; color:var(--text-dim); cursor:pointer; text-decoration:underline; margin-top:10px; display:inline-block; }
  .bin-id-box{
    background:var(--poc-dim); border:1px solid var(--poc); border-radius:8px; padding:10px;
    font-family:var(--mono); font-size:12px; color:var(--poc); margin-top:10px; word-break:break-all;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const COLUMNS = [
  {id:'backlog', title:'Backlog'},
  {id:'poc', title:'POC In Progress'},
  {id:'live', title:'Live Implementations'},
  {id:'done', title:'Done and Dusted'},
];

const STORAGE_KEY = 'impl-tracker:cards';
const KEY_KEY = 'impl-tracker:jsonbin-key';
const BIN_KEY = 'impl-tracker:jsonbin-bin';
const AVATAR_COLORS = ['#5eead4','#fb923c','#a78bfa','#f472b6','#60a5fa','#facc15','#4ade80','#f87171'];

let cards = [];
let dragCardId = null;
let editingId = null;
let loaded = false;
let showSettings = false;
let showDebug = false;
let syncState = 'off'; // 'off' | 'ok' | 'error'
let debugLog = [];
let settingsBusy = false;
let lastCreatedBinId = '';

function logDebug(msg){
  const time = new Date().toLocaleTimeString();
  debugLog.unshift(`[${time}] ${msg}`);
  debugLog = debugLog.slice(0, 14);
}

function getApiKey(){ return localStorage.getItem(KEY_KEY) || ''; }
function getBinId(){ return localStorage.getItem(BIN_KEY) || ''; }
function setCreds(key, bin){
  localStorage.setItem(KEY_KEY, key.trim());
  localStorage.setItem(BIN_KEY, bin.trim());
}
function clearCreds(){
  localStorage.removeItem(KEY_KEY);
  localStorage.removeItem(BIN_KEY);
}
function cryptoId(){ return 'c'+Math.random().toString(36).slice(2,10); }

function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/')){
      reject(new Error('Please choose an image file'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not load that image'));
      img.onload = () => {
        const size = maxSize || 96;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        // Cover-fit: fill the square, cropping evenly, so logos of any
        // aspect ratio still look like a consistent icon.
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function seedCards(){
  const now = new Date().toISOString();
  return [
    {id: cryptoId(), title:'Fraud check API', type:'poc', owner:'', client:'Acme Corp', domain:'acme.com', col:'poc',
      noteLog:[{id: cryptoId(), text:'Testing latency against vendor sandbox', at: now}]},
    {id: cryptoId(), title:'Client onboarding flow', type:'live', owner:'', client:'Globex', domain:'globex.com', col:'live',
      noteLog:[{id: cryptoId(), text:'Rolled out to 3 pilot clients', at: now}]},
  ];
}

// Cards saved before notes became a dated log had a single 'notes' string.
// Convert those into a one-entry log so old data keeps working, without
// ever touching timestamps on entries that already exist as log entries.
function migrateCards(list){
  return (list || []).map(c => {
    if(!Array.isArray(c.noteLog)){
      c.noteLog = c.notes ? [{id: cryptoId(), text: c.notes, at: c.updatedAt || new Date().toISOString()}] : [];
    }
    return c;
  });
}

// --- JSONBin.io helpers. CORS is enabled on every JSONBin endpoint, and
// these are plain GET/PUT/POST calls with no redirect chain, so this avoids
// every issue we hit with the Apps Script approach.
const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

async function jsonbinCreateBin(apiKey, initialData){
  const res = await fetch(JSONBIN_BASE, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': apiKey,
      'X-Bin-Name': 'implementation-tracker'
    },
    body: JSON.stringify(initialData)
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Create failed: HTTP ' + res.status + (text ? ' — ' + text.slice(0,200) : ''));
  }
  const json = await res.json();
  const id = json && json.metadata && json.metadata.id;
  if(!id) throw new Error('Create succeeded but no bin id was returned');
  return id;
}

async function jsonbinRead(apiKey, binId){
  const res = await fetch(`${JSONBIN_BASE}/${binId}/latest`, {
    headers: { 'X-Master-Key': apiKey }
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Read failed: HTTP ' + res.status + (text ? ' — ' + text.slice(0,200) : ''));
  }
  const json = await res.json();
  return json.record;
}

async function jsonbinWrite(apiKey, binId, data){
  const res = await fetch(`${JSONBIN_BASE}/${binId}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': apiKey
    },
    body: JSON.stringify(data)
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error('Write failed: HTTP ' + res.status + (text ? ' — ' + text.slice(0,200) : ''));
  }
  return true;
}

async function loadCards(){
  const apiKey = getApiKey();
  const binId = getBinId();
  if(apiKey && binId){
    try{
      flashStatus('Syncing…');
      logDebug('READ bin ' + binId);
      const record = await jsonbinRead(apiKey, binId);
      cards = migrateCards(Array.isArray(record) ? record : seedCards());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      syncState = 'ok';
      logDebug('Read OK — ' + cards.length + ' card(s)');
      flashStatus('Synced from cloud');
    }catch(e){
      syncState = 'error';
      logDebug('Read FAILED — ' + e.message);
      const raw = localStorage.getItem(STORAGE_KEY);
      cards = migrateCards(raw ? JSON.parse(raw) : seedCards());
      flashStatus('Could not reach cloud — showing last saved copy');
    }
  } else {
    const raw = localStorage.getItem(STORAGE_KEY);
    cards = migrateCards(raw ? JSON.parse(raw) : seedCards());
  }
  loaded = true;
  render();
}

async function saveCards(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  const apiKey = getApiKey();
  const binId = getBinId();
  if(!apiKey || !binId){
    flashStatus('Saved locally (not connected to cloud sync)');
    return;
  }

  // If we're not currently in a known-good connected state, verify/re-establish
  // the connection first, rather than assuming the write will succeed.
  if(syncState !== 'ok'){
    try{
      flashStatus('Reconnecting…');
      logDebug('Reconnect check before save (bin ' + binId + ')');
      await jsonbinRead(apiKey, binId);
      syncState = 'ok';
      logDebug('Reconnect OK');
      render();
    }catch(e){
      syncState = 'error';
      logDebug('Reconnect FAILED — ' + e.message);
      flashStatus('Saved locally — could not reconnect to cloud');
      render();
      return;
    }
  }

  try{
    flashStatus('Saving to cloud…');
    logDebug('WRITE bin ' + binId + ' — ' + cards.length + ' card(s)');
    await jsonbinWrite(apiKey, binId, cards);
    syncState = 'ok';
    logDebug('Write OK');
    flashStatus('Saved to cloud');
    render();
  }catch(e){
    syncState = 'error';
    logDebug('Write FAILED — ' + e.message);
    flashStatus('Saved locally — could not reach cloud');
    render();
  }
}

let statusTimer;
function flashStatus(msg){
  const el = document.getElementById('status-msg');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}

function openModal(id){ editingId = id || null; render(); }
function closeModal(){ editingId = null; render(); }

function upsertCard(data){
  const stamped = { ...data, updatedAt: new Date().toISOString() };
  if(editingId && editingId !== 'new'){
    cards = cards.map(c => c.id === editingId ? {...c, ...stamped} : c);
  } else {
    cards.push({id: cryptoId(), col:'backlog', ...stamped});
  }
  saveCards();
  closeModal();
}

let expandedCards = new Set();
function toggleExpand(id){
  if(expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  render();
}

function deleteCard(id){
  cards = cards.filter(c => c.id !== id);
  saveCards();
  closeModal();
}

function moveCard(id, col){
  cards = cards.map(c => c.id === id ? {...c, col} : c);
  saveCards();
  render();
}

function colorForName(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function initialsForName(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function renderAvatar(card){
  const client = (card.client || '').trim();
  if(!client && !card.logo) return '';
  const initials = initialsForName(client || '?');
  const bg = colorForName(client || 'x');
  if(card.logo){
    // Uploaded image — always available, no need for a fallback underneath.
    return `<div class="avatar" style="background:transparent" title="${escapeAttr(client)}"><img src="${card.logo}" alt=""></div>`;
  }
  const domain = (card.domain || '').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  if(domain){
    // Auto-fetched logo — if it fails to load, remove it so initials show through.
    return `<div class="avatar" style="background:${bg}" title="${escapeAttr(client)}"><img src="https://logo.clearbit.com/${escapeAttr(domain)}?size=64" alt="" onerror="this.remove()"><span>${initials}</span></div>`;
  }
  return `<div class="avatar" style="background:${bg}" title="${escapeAttr(client)}"><span>${initials}</span></div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = `<div style="color:var(--text-dim);font-family:var(--mono);font-size:13px;padding:40px;">Loading board…</div>`;
    return;
  }

  const editing = editingId && editingId !== 'new' ? cards.find(c=>c.id===editingId) : null;
  const connected = !!(getApiKey() && getBinId());
  const dotClass = !connected ? 'off' : (syncState === 'error' ? 'error' : 'on');
  const syncLabel = !connected
    ? 'Not connected — saving to this browser only'
    : (syncState === 'error' ? 'Connected, but last sync failed — click ⟳ to retry' : 'Connected — synced across devices');

  app.innerHTML = `
    <div class="header">
      <div></div>
      <div class="header-center">
        <h1>My Project Dashboard</h1>
        <p class="total-count">${cards.length} and counting...</p>
      </div>
      <div class="header-actions">
        <button class="icon-only-btn" id="refresh-btn" title="Refresh from cloud">⟳</button>
        <button class="icon-only-btn" id="settings-btn" title="Connect cloud sync">⚙</button>
        <button class="add-btn" id="add-btn">+ New implementation</button>
      </div>
    </div>
    <div class="sync-line"><span class="sync-dot ${dotClass}"></span>${syncLabel}</div>
    <div class="board">
      ${COLUMNS.map(colDef => renderColumn(colDef)).join('')}
    </div>
    <div class="status-msg" id="status-msg"></div>
    ${editingId !== null ? renderModal(editing) : ''}
    ${showSettings ? renderSettings() : ''}
  `;

  document.getElementById('add-btn').onclick = () => { editingId = 'new'; render(); };
  document.getElementById('refresh-btn').onclick = async () => { loaded = false; render(); await loadCards(); };
  document.getElementById('settings-btn').onclick = () => { showSettings = true; render(); };

  document.querySelectorAll('.card').forEach(el=>{
    const id = el.dataset.id;
    el.addEventListener('dragstart', () => { dragCardId = id; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('click', (e) => {
      if(e.target.closest('.icon-btn')) return;
      toggleExpand(id);
    });
  });
  document.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(btn.dataset.id); });
  });
  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteCard(btn.dataset.id); });
  });
  document.querySelectorAll('.column').forEach(colEl=>{
    colEl.addEventListener('dragover', e=>{ e.preventDefault(); colEl.classList.add('drag-over'); });
    colEl.addEventListener('dragleave', ()=> colEl.classList.remove('drag-over'));
    colEl.addEventListener('drop', e=>{
      e.preventDefault(); colEl.classList.remove('drag-over');
      if(dragCardId) moveCard(dragCardId, colEl.dataset.col);
      dragCardId = null;
    });
  });

  if(editingId !== null) setupModalHandlers(editing);
  if(showSettings) setupSettingsHandlers();
}

function renderColumn(colDef){
  const colCards = cards.filter(c => c.col === colDef.id);
  return `
    <div class="column" data-col="${colDef.id}">
      <div class="col-head">
        <span class="col-title">${colDef.title}</span>
        <span class="col-count">${colCards.length}</span>
      </div>
      ${colCards.length === 0 ? `<div class="empty-hint">No cards yet</div>` : ''}
      ${colCards.map(renderCard).join('')}
    </div>
  `;
}

function ensureUrl(url){
  if(!url) return '';
  if(!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

function formatTimestamp(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function renderCard(card){
  const isLive = card.type === 'live';
  const isExpanded = expandedCards.has(card.id);
  const displayName = card.client || card.title;

  if(!isExpanded){
    return `
      <div class="card collapsed" draggable="true" data-id="${card.id}">
        <div class="card-collapsed-row">
          <span class="collapsed-name">${escapeHtml(displayName)}</span>
          ${(card.modules && card.modules.length) || card.infraType ? `
            <div class="meta-row" style="margin:0; flex:0 0 auto;">
              ${(card.modules||[]).map(m => `<span class="chip">${escapeHtml(m)}</span>`).join('')}
              ${card.infraType ? `<span class="chip infra">${escapeHtml(card.infraType)}</span>` : ''}
            </div>
          ` : ''}
          ${renderAvatar(card)}
        </div>
      </div>
    `;
  }

  const noteLog = Array.isArray(card.noteLog)
    ? [...card.noteLog].sort((a,b) => new Date(b.at) - new Date(a.at))
    : [];

  return `
    <div class="card expanded" draggable="true" data-id="${card.id}">
      <div class="card-top">
        <span class="badge ${card.type}">${isLive ? '<span class="pulse"></span>Live Implementations' : 'POC'}</span>
        <div class="card-actions">
          <button class="icon-btn edit-btn" data-id="${card.id}" title="Edit">✎</button>
          <button class="icon-btn del-btn" data-id="${card.id}" title="Delete">✕</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-main">
          <p class="card-title">${escapeHtml(card.title)}</p>
          ${card.client ? `<p class="owner" style="margin:0 0 6px;">${escapeHtml(card.client)}</p>` : ''}
          ${(card.modules && card.modules.length) || card.infraType ? `
            <div class="meta-row">
              ${(card.modules||[]).map(m => `<span class="chip">${escapeHtml(m)}</span>`).join('')}
              ${card.infraType ? `<span class="chip infra">${escapeHtml(card.infraType)}</span>` : ''}
            </div>
          ` : ''}
          ${(card.links && card.links.length) ? `
            <div class="card-links">
              ${card.links.map(l => `<a href="${escapeAttr(ensureUrl(l.url))}" target="_blank" rel="noopener" class="card-link" onclick="event.stopPropagation()">🔗 ${escapeHtml(l.name)}</a>`).join('')}
            </div>
          ` : ''}
          ${noteLog.map(n => `
            <div class="note-entry-view">
              <p class="card-notes">${escapeHtml(n.text)}</p>
              <p class="note-timestamp">${formatTimestamp(n.at)}</p>
            </div>
          `).join('')}
          ${card.owner ? `<div class="card-foot"><span class="owner">${escapeHtml(card.owner)}</span></div>` : ''}
        </div>
        ${renderAvatar(card)}
      </div>
    </div>
  `;
}

function renderModal(editing){
  const isNew = !editing;
  const data = editing || {title:'', type:'poc', owner:'', client:'', domain:'', logo:'', modules:[], infraType:'', links:[]};
  return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>${isNew ? 'New implementation' : 'Edit implementation'}</h2>
        <div class="field">
          <label>Type</label>
          <div class="type-toggle">
            <button type="button" class="type-btn ${data.type==='poc'?'active poc':''}" data-type="poc">POC</button>
            <button type="button" class="type-btn ${data.type==='live'?'active live':''}" data-type="live">LIVE</button>
          </div>
        </div>
        <div class="field"><label>Name</label><input id="f-title" type="text" value="${escapeAttr(data.title)}" placeholder="e.g. Fraud check API"></div>
        <div class="field"><label>Client</label><input id="f-client" type="text" value="${escapeAttr(data.client)}" placeholder="e.g. Acme Corp"></div>
        <div class="field">
          <label>Client logo</label>
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="avatar" id="logo-preview" style="width:40px;height:40px;border-radius:8px;font-size:14px;background:${data.logo ? 'transparent' : colorForName(data.client || 'x')}">
              ${data.logo ? `<img src="${data.logo}" alt="">` : `<span>${initialsForName(data.client || '?')}</span>`}
            </div>
            <input type="file" id="f-logo-file" accept="image/*" style="flex:1; font-size:12px;">
            <button type="button" class="icon-btn" id="f-logo-remove" title="Remove logo" style="border:1px solid var(--border); border-radius:6px; padding:6px 8px; ${data.logo ? '' : 'display:none;'}">✕</button>
          </div>
          <p class="field-hint">Upload a PNG/JPG and it'll be resized and embedded automatically. If left blank, a logo is auto-fetched from the client's website below, falling back to initials.</p>
        </div>
        <div class="field">
          <label>Client website (optional fallback, for auto-logo)</label>
          <input id="f-domain" type="text" value="${escapeAttr(data.domain)}" placeholder="e.g. acme.com">
        </div>
        <div class="field">
          <label>Modules opted</label>
          <div class="type-toggle">
            <button type="button" class="module-btn ${(data.modules||[]).includes('CGP') ? 'active poc':''}" data-module="CGP">CGP</button>
            <button type="button" class="module-btn ${(data.modules||[]).includes('CM') ? 'active poc':''}" data-module="CM">CM</button>
            <button type="button" class="module-btn ${(data.modules||[]).includes('DC') ? 'active poc':''}" data-module="DC">DC</button>
          </div>
        </div>
        <div class="field">
          <label>Infra type</label>
          <div class="type-toggle">
            <button type="button" class="infra-btn ${data.infraType==='SaaS' ? 'active poc':''}" data-infra="SaaS">SaaS</button>
            <button type="button" class="infra-btn ${data.infraType==='On-Prem' ? 'active live':''}" data-infra="On-Prem">On-Prem</button>
          </div>
        </div>
        <div class="field">
          <label>Drive links</label>
          <div class="note-history" id="link-list"></div>
          <div class="field-row" style="margin-top:8px;">
            <div class="field"><input id="f-link-name" type="text" placeholder="e.g. Architecture Document"></div>
            <div class="field"><input id="f-link-url" type="text" placeholder="Paste Google Drive link"></div>
            <button type="button" class="btn" id="add-link-btn">Add</button>
          </div>
        </div>
        <div class="field">
          <label>Add a note</label>
          <textarea id="f-notes" placeholder="Type a new note — it's logged with today's date and time. Earlier notes keep their original timestamps."></textarea>
        </div>
        <div class="field">
          <label>Note history</label>
          <div class="note-history" id="note-history"></div>
        </div>
        <div class="field"><label>Owner (optional)</label><input id="f-owner" type="text" value="${escapeAttr(data.owner)}" placeholder="e.g. you, or a teammate"></div>
        <div class="modal-actions">
          <div>${!isNew ? `<button class="btn delete" id="modal-delete">Delete</button>` : ''}</div>
          <div style="display:flex;gap:8px;">
            <button class="btn" id="modal-cancel">Cancel</button>
            <button class="btn primary" id="modal-save">${isNew ? 'Add card' : 'Save'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function setupModalHandlers(editing){
  let currentType = (editing && editing.type) || 'poc';
  let currentLogo = (editing && editing.logo) || '';
  let currentModules = (editing && Array.isArray(editing.modules)) ? [...editing.modules] : [];
  let currentInfra = (editing && editing.infraType) || '';
  let linkDraft = (editing && Array.isArray(editing.links)) ? [...editing.links] : [];
  let noteLogDraft = (editing && Array.isArray(editing.noteLog)) ? [...editing.noteLog] : [];

  function renderLinkList(){
    const container = document.getElementById('link-list');
    if(!container) return;
    if(linkDraft.length === 0){
      container.innerHTML = `<p class="field-hint">No links added yet.</p>`;
      return;
    }
    container.innerHTML = linkDraft.map(l => `
      <div class="note-entry" data-link-id="${l.id}" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <a href="${escapeAttr(ensureUrl(l.url))}" target="_blank" rel="noopener" style="color:var(--poc); font-size:12px; text-decoration:none; word-break:break-word;">🔗 ${escapeHtml(l.name)}</a>
        <button type="button" class="icon-btn link-del" data-link-id="${l.id}" title="Remove link">✕</button>
      </div>
    `).join('');
    container.querySelectorAll('.link-del').forEach(btn=>{
      btn.addEventListener('click', () => {
        linkDraft = linkDraft.filter(l => l.id !== btn.dataset.linkId);
        renderLinkList();
      });
    });
  }
  renderLinkList();

  document.getElementById('add-link-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('f-link-name');
    const urlInput = document.getElementById('f-link-url');
    const name = nameInput.value.trim();
    const url = urlInput.value.trim();
    if(!name || !url){ flashStatus('Enter both a name and a link'); return; }
    linkDraft.push({id: cryptoId(), name, url: ensureUrl(url)});
    nameInput.value = '';
    urlInput.value = '';
    renderLinkList();
  });

  document.querySelectorAll('.module-btn').forEach(btn=>{
    btn.addEventListener('click', () => {
      const m = btn.dataset.module;
      if(currentModules.includes(m)){
        currentModules = currentModules.filter(x => x !== m);
        btn.classList.remove('active','poc');
      } else {
        currentModules.push(m);
        btn.classList.add('active','poc');
      }
    });
  });

  document.querySelectorAll('.infra-btn').forEach(btn=>{
    btn.addEventListener('click', () => {
      const val = btn.dataset.infra;
      document.querySelectorAll('.infra-btn').forEach(b => b.classList.remove('active','poc','live'));
      if(currentInfra === val){
        currentInfra = '';
      } else {
        currentInfra = val;
        btn.classList.add('active', val === 'SaaS' ? 'poc' : 'live');
      }
    });
  });

  function renderNoteHistory(){
    const container = document.getElementById('note-history');
    if(!container) return;
    if(noteLogDraft.length === 0){
      container.innerHTML = `<p class="field-hint">No notes yet — add one above.</p>`;
      return;
    }
    const sorted = [...noteLogDraft].sort((a,b) => new Date(b.at) - new Date(a.at));
    container.innerHTML = sorted.map(n => `
      <div class="note-entry" data-note-id="${n.id}">
        <p class="note-entry-text">${escapeHtml(n.text)}</p>
        <div class="note-entry-meta">
          <span>${formatTimestamp(n.at)}</span>
          <button type="button" class="icon-btn note-del" data-note-id="${n.id}" title="Delete this note">✕</button>
        </div>
      </div>
    `).join('');
    container.querySelectorAll('.note-del').forEach(btn=>{
      btn.addEventListener('click', () => {
        const noteId = btn.dataset.noteId;
        noteLogDraft = noteLogDraft.filter(n => n.id !== noteId);
        renderNoteHistory();
      });
    });
  }
  renderNoteHistory();

  document.querySelectorAll('.type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentType = btn.dataset.type;
      document.querySelectorAll('.type-btn').forEach(b=> b.classList.remove('active','poc','live'));
      btn.classList.add('active', currentType);
    });
  });

  function refreshLogoPreview(){
    const preview = document.getElementById('logo-preview');
    const removeBtn = document.getElementById('f-logo-remove');
    const clientName = document.getElementById('f-client').value.trim() || '?';
    if(currentLogo){
      preview.style.background = 'transparent';
      preview.innerHTML = `<img src="${currentLogo}" alt="">`;
      if(removeBtn) removeBtn.style.display = '';
    } else {
      preview.style.background = colorForName(clientName);
      preview.innerHTML = `<span>${initialsForName(clientName)}</span>`;
      if(removeBtn) removeBtn.style.display = 'none';
    }
  }

  const fileInput = document.getElementById('f-logo-file');
  if(fileInput){
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        flashStatus('Processing image…');
        currentLogo = await resizeImageToDataUrl(file, 96);
        refreshLogoPreview();
        flashStatus('Logo ready');
      }catch(err){
        flashStatus(err.message || 'Could not process that image');
      }
    });
  }
  const removeBtn = document.getElementById('f-logo-remove');
  if(removeBtn){
    removeBtn.addEventListener('click', () => {
      currentLogo = '';
      refreshLogoPreview();
    });
  }
  const clientInput = document.getElementById('f-client');
  if(clientInput){
    clientInput.addEventListener('input', () => { if(!currentLogo) refreshLogoPreview(); });
  }

  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('modal-cancel').onclick = closeModal;
  if(document.getElementById('modal-delete')){
    document.getElementById('modal-delete').onclick = () => deleteCard(editing.id);
  }
  document.getElementById('modal-save').onclick = () => {
    const title = document.getElementById('f-title').value.trim();
    if(!title){ document.getElementById('f-title').focus(); return; }
    const newNoteText = document.getElementById('f-notes').value.trim();
    const owner = document.getElementById('f-owner').value.trim();
    const client = document.getElementById('f-client').value.trim();
    const domain = document.getElementById('f-domain').value.trim();
    let finalLog = [...noteLogDraft];
    if(newNoteText){
      finalLog.push({id: cryptoId(), text: newNoteText, at: new Date().toISOString()});
    }
    upsertCard({title, owner, client, domain, logo: currentLogo, type: currentType, noteLog: finalLog, modules: currentModules, infraType: currentInfra, links: linkDraft});
  };
}

function renderSettings(){
  const apiKey = getApiKey();
  const binId = getBinId();
  const connected = !!(apiKey && binId);
  return `
    <div class="overlay" id="settings-overlay">
      <div class="modal">
        <h2>Connect cloud sync</h2>
        <p class="sub">Uses JSONBin.io (free) to sync your board across devices. Sign up at jsonbin.io, copy your Master Key from the API Keys page, and paste it below.</p>
        <div class="field">
          <label>JSONBin Master Key</label>
          <input id="f-apikey" type="text" value="${escapeAttr(apiKey)}" placeholder="$2a$10$...">
        </div>
        <div class="field">
          <label>Bin ID (leave blank to create a new one)</label>
          <input id="f-binid" type="text" value="${escapeAttr(binId)}" placeholder="e.g. 64f2a1...">
          <p class="field-hint">First device: leave blank and click Connect — a bin will be created and its ID shown below. Other devices: paste that same Bin ID here so everyone reads/writes the same data.</p>
        </div>
        ${lastCreatedBinId ? `<div class="bin-id-box">New bin created: <strong>${escapeHtml(lastCreatedBinId)}</strong><br>Save this — paste it into the Bin ID field on your other devices.</div>` : ''}
        <div class="modal-actions">
          <div>${connected ? `<button class="btn delete" id="settings-disconnect">Disconnect</button>` : ''}</div>
          <div style="display:flex;gap:8px;">
            <button class="btn" id="settings-cancel">Cancel</button>
            <button class="btn primary" id="settings-save" ${settingsBusy ? 'disabled' : ''}>${settingsBusy ? 'Connecting…' : 'Connect'}</button>
          </div>
        </div>
        <div class="debug-toggle" id="debug-toggle">${showDebug ? 'Hide' : 'Show'} connection log</div>
        ${showDebug ? `<div class="debug-box">${debugLog.length ? escapeHtml(debugLog.join('\\n')) : 'No activity yet.'}</div>` : ''}
      </div>
    </div>
  `;
}

function setupSettingsHandlers(){
  document.getElementById('settings-overlay').addEventListener('click', (e)=>{
    if(e.target.id === 'settings-overlay'){ showSettings = false; lastCreatedBinId = ''; render(); }
  });
  document.getElementById('settings-cancel').onclick = () => { showSettings = false; lastCreatedBinId = ''; render(); };
  document.getElementById('debug-toggle').onclick = () => { showDebug = !showDebug; render(); };
  if(document.getElementById('settings-disconnect')){
    document.getElementById('settings-disconnect').onclick = () => {
      clearCreds();
      showSettings = false;
      lastCreatedBinId = '';
      syncState = 'off';
      render();
    };
  }
  document.getElementById('settings-save').onclick = async () => {
    const apiKey = document.getElementById('f-apikey').value.trim();
    let binId = document.getElementById('f-binid').value.trim();
    if(!apiKey){
      flashStatus('Paste your JSONBin Master Key first');
      return;
    }
    settingsBusy = true;
    render();
    try{
      if(!binId){
        logDebug('CREATE new bin');
        binId = await jsonbinCreateBin(apiKey, cards.length ? cards : seedCards());
        lastCreatedBinId = binId;
        logDebug('Create OK — bin ' + binId);
      }
      setCreds(apiKey, binId);
      settingsBusy = false;
      loaded = false;
      render();
      await loadCards();
    }catch(e){
      settingsBusy = false;
      syncState = 'error';
      logDebug('Connect FAILED — ' + e.message);
      flashStatus('Could not connect — check the log below');
      render();
    }
  };
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

loadCards();
</script>
</body>
</html>
