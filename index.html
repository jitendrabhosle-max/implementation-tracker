<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implementation Tracker</title>
<style>
  :root{
    --bg:#12141a;
    --surface:#1a1d24;
    --surface-2:#20242c;
    --border:#2b2f38;
    --text:#e7e9ee;
    --text-dim:#8b9099;
    --poc:#5eead4;
    --poc-dim:#1b3a37;
    --live:#fb923c;
    --live-dim:#3a2818;
    --danger:#f16a6a;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:var(--sans);}
  #app{
    background:var(--bg);
    min-height:100vh;
    padding:28px 24px 60px;
  }
  .header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:16px;
  }
  .header h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .header p{
    margin:0;
    color:var(--text-dim);
    font-size:13px;
    font-family:var(--mono);
  }
  .add-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:border-color .15s, background .15s;
  }
  .add-btn:hover{
    border-color:#3a3f4a;
    background:#252932;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(4, minmax(240px,1fr));
    gap:14px;
    align-items:start;
  }
  @media (max-width:900px){
    .board{grid-template-columns:1fr;}
  }
  .column{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    min-height:120px;
  }
  .column.drag-over{
    border-color:#4a4f5c;
    background:#1d2029;
  }
  .col-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 4px 12px;
  }
  .col-title{
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
  }
  .col-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    background:var(--surface-2);
    border-radius:5px;
    padding:1px 6px;
  }
  .card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px 12px 10px;
    margin-bottom:9px;
    cursor:grab;
    transition:border-color .15s, transform .1s;
  }
  .card:active{cursor:grabbing;}
  .card:hover{border-color:#3a3f4a;}
  .card.dragging{opacity:.4;}
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .card-top-left{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }
  .avatar{
    width:22px;
    height:22px;
    border-radius:6px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:9px;
    font-weight:700;
    color:#0c0d10;
    overflow:hidden;
    position:relative;
    background:#6b7280;
  }
  .avatar img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#fff;
  }
  .avatar span{
    position:relative;
    z-index:0;
  }
  .badge{
    font-family:var(--mono);
    font-size:10px;
    font-weight:600;
    letter-spacing:.03em;
    padding:2px 7px;
    border-radius:5px;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .badge.poc{background:var(--poc-dim);color:var(--poc);}
  .badge.live{background:var(--live-dim);color:var(--live);}
  .pulse{
    width:6px;height:6px;border-radius:50%;
    background:var(--live);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(251,146,60,.5);}
    50%{opacity:.6; box-shadow:0 0 0 4px rgba(251,146,60,0);}
  }
  .card-title{
    font-size:13.5px;
    font-weight:500;
    line-height:1.35;
    margin:0 0 4px;
    word-break:break-word;
  }
  .card-notes{
    font-size:12px;
    color:var(--text-dim);
    line-height:1.4;
    margin:0 0 8px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .owner{
    font-size:11px;
    color:var(--text-dim);
    font-family:var(--mono);
  }
  .card-actions{
    display:flex;
    gap:6px;
    opacity:0;
    transition:opacity .12s;
  }
  .card:hover .card-actions{opacity:1;}
  .icon-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:12px;
    padding:2px 4px;
    border-radius:4px;
  }
  .icon-btn:hover{color:var(--text); background:var(--border);}
  .empty-hint{
    color:var(--text-dim);
    font-size:12px;
    font-family:var(--mono);
    padding:8px 4px 2px;
  }
  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(8,9,12,.6);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    width:100%;
    max-width:420px;
    padding:20px;
  }
  .modal h2{
    font-size:15px;
    margin:0 0 16px;
    font-weight:600;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:5px;
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:7px;
    font-size:13px;
    font-family:var(--sans);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .type-toggle{display:flex; gap:8px;}
  .type-toggle button{
    flex:1;
    padding:8px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:12px;
    font-weight:600;
    font-family:var(--mono);
    cursor:pointer;
  }
  .type-toggle button.active.poc{background:var(--poc-dim); color:var(--poc); border-color:var(--poc);}
  .type-toggle button.active.live{background:var(--live-dim); color:var(--live); border-color:var(--live);}
  .field-hint{
    font-size:11px;
    color:var(--text-dim);
    margin-top:5px;
    line-height:1.4;
  }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
  }
  .btn{
    padding:8px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
  }
  .btn.primary{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  .btn.delete{
    background:none;
    border:none;
    color:var(--danger);
    font-size:12px;
  }
  .status-msg{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:11px;
    padding:6px 12px;
    border-radius:20px;
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
  }
  .status-msg.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const COLUMNS = [
  {id:'backlog', title:'Backlog'},
  {id:'poc', title:'POC In Progress'},
  {id:'live', title:'Live'},
  {id:'done', title:'Archived'},
];

let cards = [];
let dragCardId = null;
let editingId = null;
let loaded = false;

const STORAGE_KEY = 'impl-tracker:cards';

async function loadCards(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    cards = res ? JSON.parse(res.value) : seedCards();
  }catch(e){
    cards = seedCards();
  }
  loaded = true;
  render();
}

function seedCards(){
  return [
    {id: cryptoId(), title:'Fraud check API', type:'poc', notes:'Testing latency against vendor sandbox', owner:'', client:'Acme Corp', domain:'acme.com', col:'poc'},
    {id: cryptoId(), title:'Client onboarding flow', type:'live', notes:'Rolled out to 3 pilot clients', owner:'', client:'Globex', domain:'globex.com', col:'live'},
  ];
}

function cryptoId(){
  return 'c'+Math.random().toString(36).slice(2,10);
}

async function saveCards(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(cards), false);
    flashStatus('Saved');
  }catch(e){
    flashStatus('Save failed — changes may not persist');
  }
}

let statusTimer;
function flashStatus(msg){
  const el = document.getElementById('status-msg');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=> el.classList.remove('show'), 1400);
}

function openModal(id){
  editingId = id || null;
  render();
}
function closeModal(){
  editingId = null;
  render();
}

function upsertCard(data){
  if(editingId){
    cards = cards.map(c => c.id === editingId ? {...c, ...data} : c);
  } else {
    cards.push({id: cryptoId(), col:'backlog', ...data});
  }
  saveCards();
  closeModal();
}

function deleteCard(id){
  cards = cards.filter(c => c.id !== id);
  saveCards();
  closeModal();
}

function moveCard(id, col){
  cards = cards.map(c => c.id === id ? {...c, col} : c);
  saveCards();
  render();
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = `<div style="color:var(--text-dim);font-family:var(--mono);font-size:13px;padding:40px;">Loading board…</div>`;
    return;
  }

  const editing = editingId !== null ? cards.find(c=>c.id===editingId) : (editingId === 'new' ? null : undefined);

  app.innerHTML = `
    <div class="header">
      <div>
        <h1>Implementation Tracker</h1>
        <p>POC → Live pipeline · drag cards between columns</p>
      </div>
      <button class="add-btn" id="add-btn">+ New implementation</button>
    </div>
    <div class="board">
      ${COLUMNS.map(colDef => renderColumn(colDef)).join('')}
    </div>
    <div class="status-msg" id="status-msg"></div>
    ${editingId !== null ? renderModal(editing) : ''}
  `;

  document.getElementById('add-btn').onclick = () => { editingId = 'new'; render(); };

  document.querySelectorAll('.card').forEach(el=>{
    const id = el.dataset.id;
    el.addEventListener('dragstart', e => {
      dragCardId = id;
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('click', (e) => {
      if(e.target.closest('.icon-btn')) return;
      openModal(id);
    });
  });

  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteCard(btn.dataset.id);
    });
  });

  document.querySelectorAll('.column').forEach(colEl=>{
    colEl.addEventListener('dragover', e=>{
      e.preventDefault();
      colEl.classList.add('drag-over');
    });
    colEl.addEventListener('dragleave', ()=> colEl.classList.remove('drag-over'));
    colEl.addEventListener('drop', e=>{
      e.preventDefault();
      colEl.classList.remove('drag-over');
      if(dragCardId) moveCard(dragCardId, colEl.dataset.col);
      dragCardId = null;
    });
  });

  if(editingId !== null){
    setupModalHandlers(editing);
  }
}

function renderColumn(colDef){
  const colCards = cards.filter(c => c.col === colDef.id);
  return `
    <div class="column" data-col="${colDef.id}">
      <div class="col-head">
        <span class="col-title">${colDef.title}</span>
        <span class="col-count">${colCards.length}</span>
      </div>
      ${colCards.length === 0 ? `<div class="empty-hint">No cards yet</div>` : ''}
      ${colCards.map(renderCard).join('')}
    </div>
  `;
}

const AVATAR_COLORS = ['#5eead4','#fb923c','#a78bfa','#f472b6','#60a5fa','#facc15','#4ade80','#f87171'];

function colorForName(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

function initialsForName(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function renderAvatar(card){
  const client = (card.client || '').trim();
  if(!client) return '';
  const initials = initialsForName(client);
  const bg = colorForName(client);
  const domain = (card.domain || '').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  const logoImg = domain
    ? `<img src="https://logo.clearbit.com/${escapeAttr(domain)}?size=64" alt=""
         onerror="this.style.display='none'">`
    : '';
  return `
    <div class="avatar" style="background:${bg}" title="${escapeAttr(client)}">
      ${logoImg}
      <span>${initials}</span>
    </div>
  `;
}

function renderCard(card){
  const isLive = card.type === 'live';
  return `
    <div class="card" draggable="true" data-id="${card.id}">
      <div class="card-top">
        <div class="card-top-left">
          ${renderAvatar(card)}
          <span class="badge ${card.type}">
            ${isLive ? '<span class="pulse"></span>LIVE' : 'POC'}
          </span>
        </div>
        <div class="card-actions">
          <button class="icon-btn del-btn" data-id="${card.id}" title="Delete">✕</button>
        </div>
      </div>
      <p class="card-title">${escapeHtml(card.title)}</p>
      ${card.client ? `<p class="owner" style="margin:0 0 6px;">${escapeHtml(card.client)}</p>` : ''}
      ${card.notes ? `<p class="card-notes">${escapeHtml(card.notes)}</p>` : ''}
      ${card.owner ? `<div class="card-foot"><span class="owner">${escapeHtml(card.owner)}</span></div>` : ''}
    </div>
  `;
}

function renderModal(editing){
  const isNew = !editing;
  const data = editing || {title:'', type:'poc', notes:'', owner:'', client:'', domain:''};
  return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>${isNew ? 'New implementation' : 'Edit implementation'}</h2>
        <div class="field">
          <label>Type</label>
          <div class="type-toggle">
            <button type="button" class="type-btn ${data.type==='poc'?'active poc':''}" data-type="poc">POC</button>
            <button type="button" class="type-btn ${data.type==='live'?'active live':''}" data-type="live">LIVE</button>
          </div>
        </div>
        <div class="field">
          <label>Name</label>
          <input id="f-title" type="text" value="${escapeAttr(data.title)}" placeholder="e.g. Fraud check API">
        </div>
        <div class="field">
          <label>Client</label>
          <input id="f-client" type="text" value="${escapeAttr(data.client)}" placeholder="e.g. Acme Corp">
        </div>
        <div class="field">
          <label>Client website (optional, for logo)</label>
          <input id="f-domain" type="text" value="${escapeAttr(data.domain)}" placeholder="e.g. acme.com">
          <p class="field-hint">Pulls the logo from the client's site automatically. Leave blank to show initials instead.</p>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="f-notes" placeholder="Context, status, links...">${escapeHtml(data.notes)}</textarea>
        </div>
        <div class="field">
          <label>Owner (optional)</label>
          <input id="f-owner" type="text" value="${escapeAttr(data.owner)}" placeholder="e.g. you, or a teammate">
        </div>
        <div class="modal-actions">
          <div>
            ${!isNew ? `<button class="btn delete" id="modal-delete">Delete</button>` : ''}
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn" id="modal-cancel">Cancel</button>
            <button class="btn primary" id="modal-save">${isNew ? 'Add card' : 'Save'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function setupModalHandlers(editing){
  let currentType = (editing && editing.type) || 'poc';

  document.querySelectorAll('.type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentType = btn.dataset.type;
      document.querySelectorAll('.type-btn').forEach(b=>{
        b.classList.remove('active','poc','live');
      });
      btn.classList.add('active', currentType);
    });
  });

  document.getElementById('overlay').addEventListener('click', (e)=>{
    if(e.target.id === 'overlay') closeModal();
  });
  document.getElementById('modal-cancel').onclick = closeModal;
  if(document.getElementById('modal-delete')){
    document.getElementById('modal-delete').onclick = () => deleteCard(editing.id);
  }
  document.getElementById('modal-save').onclick = () => {
    const title = document.getElementById('f-title').value.trim();
    if(!title) { document.getElementById('f-title').focus(); return; }
    const notes = document.getElementById('f-notes').value.trim();
    const owner = document.getElementById('f-owner').value.trim();
    const client = document.getElementById('f-client').value.trim();
    const domain = document.getElementById('f-domain').value.trim();
    upsertCard({title, notes, owner, client, domain, type: currentType});
  };
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){
  return escapeHtml(str);
}

loadCards();
</script>
</body>
</html>
